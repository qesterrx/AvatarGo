{{- if .Values.database.enabled }}
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "avatargo.fullname" . }}-{{ .Values.database.component }}-scrt
  labels:
    {{- include "avatargo.labels" . | nindent 4 }}

data:
  POSTGRES_USER: {{ .Values.database.user | b64enc }}
  POSTGRES_PASSWORD: {{ .Values.database.password | b64enc }}
type: Opaque
{{- end }}
