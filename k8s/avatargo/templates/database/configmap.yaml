{{- if .Values.database.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avatargo.fullname" . }}-{{ .Values.database.component }}-cf
  labels:
    {{- include "avatargo.labels" . | nindent 4 }}

data:
  POSTGRES_DB: {{ .Values.database.database }}
  PGDATA:  {{ .Values.database.pgdata }}
{{- end }}