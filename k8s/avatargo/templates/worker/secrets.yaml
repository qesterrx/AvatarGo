{{- if .Values.app.worker.enabled }}
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "avatargo.fullname" . }}-{{ .Values.app.worker.component }}-scrt
  labels:
    {{- include "avatargo.labels" . | nindent 4 }}

data:
  RBT_USER: {{ .Values.rabbitmq.user | b64enc }}
  RBT_PASSWORD: {{ .Values.rabbitmq.password | b64enc }}
  S3_ACCESS_KEY: {{ .Values.s3.user | b64enc }}
  S3_SECRET_KEY: {{ .Values.s3.password | b64enc }}
  DB_USER: {{ .Values.database.user | b64enc }}
  DB_PASSWORD: {{ .Values.database.password | b64enc }}
type: Opaque
{{- end }}