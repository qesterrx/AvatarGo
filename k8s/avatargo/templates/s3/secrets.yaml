{{- if .Values.s3.enabled }}
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "avatargo.fullname" . }}-{{ .Values.s3.component }}-scrt
  labels:
    {{- include "avatargo.labels" . | nindent 4 }}

data:
  MINIO_ROOT_USER: {{ .Values.s3.user | b64enc }}
  MINIO_ROOT_PASSWORD: {{ .Values.s3.password | b64enc }}
type: Opaque
{{- end }}
