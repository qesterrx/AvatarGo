{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avatargo.fullname" . }}-{{ .Values.prometheus.component }}-cf
  labels:
    {{- include "avatargo.labels" . | nindent 4 }}

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:

      - job_name: 'prometheus'
        static_configs:
          - targets: ['{{ include "avatargo.fullname" . }}-{{ .Values.prometheus.component }}-srvc:{{ .Values.prometheus.port }}']

      - job_name: 'otel-collector'
        static_configs:
          - targets: ['{{ include "avatargo.fullname" . }}-{{ .Values.otel.component }}-srvc:{{ .Values.otel.metricsPort }}']
{{- end }}