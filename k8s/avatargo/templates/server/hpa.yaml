{{- if .Values.app.server.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "avatargo.fullname" . }}-{{ .Values.app.server.component }}-hpa
  labels:
    {{- include "avatargo.labels" . | nindent 4 }}
    component: {{ .Values.app.server.component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "avatargo.fullname" . }}-{{ .Values.app.server.component }}-deploy
  minReplicas: {{ .Values.app.server.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.app.server.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.app.server.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.app.server.autoscaling.targetMEMUtilizationPercentage }}
{{- end }}
