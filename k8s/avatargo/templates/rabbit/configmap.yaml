{{- if .Values.rabbitmq.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avatargo.fullname" . }}-{{ .Values.rabbitmq.component }}-cf
  labels:
    {{- include "avatargo.labels" . | nindent 4 }}

data:
  RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: {{ .Values.rabbitmq.addarg }}
{{- end }}