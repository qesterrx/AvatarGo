services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq-avatargo
    ports:
      - "5672:5672"     # AMQP для приложений
      - "15672:15672"   # Веб-панель управления
    networks:
      - app-network
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+sbwt none +sbwtdcpu none +sbwtdio none"
      RABBITMQ_DEFAULT_USER: rabbitmq_avatargo
      RABBITMQ_DEFAULT_PASS: rabbitmq_avatargo
    volumes:
      - rabbit_data_avatargo:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: minio-avatargo
    ports:
      - "9000:9000"
      - "3000:9001"     # Веб-панель управления
    networks:
      - app-network
    command: server /mnt/data --license /minio.license
    environment:
      MINIO_ROOT_USER: minio_avatargo
      MINIO_ROOT_PASSWORD: minio_avatargo

    volumes:
      - minio_data_avatargo:/mnt/data
      - ./minio/minio.license:/minio.license
      - ./minio/certs:/etc/minio/certs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  postgres:
    image: postgres:15-alpine
    container_name: postgres-avatargo
    environment:
      POSTGRES_USER: postgres_avatargo
      POSTGRES_PASSWORD: postgres_avatargo
      POSTGRES_DB: avatargo
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - postgres_data_avatargo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avatars || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  avatargoserver:
    image: avatargo:latest
    container_name: avatargo-server
    command: ./server
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_COMPRESSION: gzip
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: avatargo-server
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
      OTEL_LOG_LEVEL: debug
      OTEL_GO_DEBUG: 1
      GRPC_GO_LOG_VERBOSITY_LEVEL: 99
      GRPC_GO_LOG_SEVERITY_LEVEL: debug
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres_avatargo
      DB_PASSWORD: postgres_avatargo
      DB_NAME: avatargo
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minio_avatargo
      S3_SECRET_KEY: minio_avatargo
      S3_BUCKET: avatargo
      S3_REGION: us-east-1
      RBT_HOST: rabbitmq
      RBT_PORT: 5672
      RBT_USER: rabbitmq_avatargo
      RBT_PASSWORD: rabbitmq_avatargo
      RBT_QUEUE: avatargo
      SRV_HOST:
      SRV_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
  avatargoworker:
    image: avatargo:latest
    container_name: avatargo-worker
    command: ./worker
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_COMPRESSION: gzip
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: avatargo-worker
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
      OTEL_LOG_LEVEL: debug
      OTEL_GO_DEBUG: 1
      GRPC_GO_LOG_VERBOSITY_LEVEL: 99
      GRPC_GO_LOG_SEVERITY_LEVEL: debug
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres_avatargo
      DB_PASSWORD: postgres_avatargo
      DB_NAME: avatargo
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minio_avatargo
      S3_SECRET_KEY: minio_avatargo
      S3_BUCKET: avatargo
      S3_REGION: us-east-1
      RBT_HOST: rabbitmq
      RBT_PORT: 5672
      RBT_USER: rabbitmq_avatargo
      RBT_PASSWORD: rabbitmq_avatargo
      RBT_QUEUE: avatargo
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector-avatargo
    restart: always
    command: ['--config=/etc/otel-collector-config.yaml']
    networks:
      - app-network
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yaml
    ports:
      - "8889:8889" # Prometheus exporter metrics
      - "4317:4317" # OTLP grpc receiver
      - "4318:4318" # OTLP http receiver
    depends_on:
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  loki:
    image: grafana/loki:3.6.5
    container_name: loki-avatargo
    command:
      - "-config.file=/etc/loki/local-config.yml"
    ports:
      - "3100:3100"
      - "9096:9096"
    networks:
      - app-network
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-avatargo
    networks:
      - app-network
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "3400:9090"

  grafana:
    image: grafana/grafana:12.3.1
    container_name: grafana-avatargo
    environment:
      - GF_SERVER_HTTP_PORT=3200
    ports:
      - "3200:3200"
    networks:
      - app-network
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger-avatargo
    restart: always
    ports:
      - "3300:16686"
    networks:
      - app-network
    healthcheck:
        test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 10s

volumes:
  postgres_data_avatargo:
  rabbit_data_avatargo:
  minio_data_avatargo:
  loki-data:
  grafana-data:

networks:
  app-network:
    name: avatar-network
    driver: bridge